name: Continuous Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual (re-)publish of an existing GitHub Release to Google Play.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish to Google Play (e.g. v0.1.1)'
        required: true

permissions: {}

jobs:
  check-and-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.check_release.outputs.version }}
      is_release: ${{ steps.check_release.outputs.is_release }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check if this is a Release commit
      id: check_release
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ $COMMIT_MSG =~ ^release:\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          echo "is_release=true" >> $GITHUB_OUTPUT
          echo "Detected release commit for version ${BASH_REMATCH[1]}"
        else
          echo "is_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Check code formatting
      run: ./gradlew spotlessCheck

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    # Always build Debug to verify code quality
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    # If it's a release commit, perform full build and signing
    - name: Decode Keystore
      if: steps.check_release.outputs.is_release == 'true'
      run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > eanalizer.jks

    - name: Build Release APK and Bundle
      if: steps.check_release.outputs.is_release == 'true'
      run: ./gradlew assembleRelease bundleRelease
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Prepare Release Assets
      if: steps.check_release.outputs.is_release == 'true'
      run: |
        VERSION="${{ steps.check_release.outputs.version }}"
        mv app/build/outputs/apk/release/app-release.apk eanalizer-mobile-${VERSION}-release.apk
        mv app/build/outputs/apk/debug/app-debug.apk eanalizer-mobile-${VERSION}-debug.apk
        mv app/build/outputs/bundle/release/app-release.aab eanalizer-mobile-${VERSION}.aab

    # Hand the exact signed bundle to the publish job (instead of re-downloading it).
    - name: Upload bundle for Play publishing
      if: steps.check_release.outputs.is_release == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-aab
        path: eanalizer-mobile-*.aab
        if-no-files-found: error
        retention-days: 7

    - name: Create Release and Upload Assets
      if: steps.check_release.outputs.is_release == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.check_release.outputs.version }}
        name: eAnalizer Mobile ${{ steps.check_release.outputs.version }}
        files: |
          eanalizer-mobile-*.apk
          eanalizer-mobile-*.aab
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Sentry release with associated commits, so "Fixes EANALIZER-MOBILE-N" in a commit
    # resolves the issue once it ships. The name must match the SDK's automatic release
    # (applicationId@versionName+versionCode). Needs the Sentry GitHub integration with
    # this repo added; skipped without the SENTRY_AUTH_TOKEN secret, never blocks a release.
    - name: Read version for Sentry
      id: sentry_version
      if: steps.check_release.outputs.is_release == 'true'
      env:
        HAS_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      run: |
        echo "enabled=$HAS_TOKEN" >> $GITHUB_OUTPUT
        NAME=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)
        CODE=$(sed -nE 's/^\s*versionCode\s*=\s*([0-9]+).*/\1/p' app/build.gradle.kts)
        echo "release=com.theundefined.eanalizer@${NAME}+${CODE}" >> $GITHUB_OUTPUT

    - name: Create Sentry release
      if: steps.sentry_version.outputs.enabled == 'true'
      continue-on-error: true
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: netrator
        SENTRY_PROJECT: eanalizer-mobile
        RELEASE: ${{ steps.sentry_version.outputs.release }}
      run: |
        # Explicit commit range (previous tag..HEAD): `--auto` silently associated nothing.
        PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
        PREV_SHA=$(git rev-list -n 1 "$PREV")
        echo "Commits $PREV ($PREV_SHA)..$GITHUB_SHA"
        CLI="npx -y @sentry/cli@3.8.0"
        $CLI releases new "$RELEASE"
        $CLI releases set-commits "$RELEASE" --commit "$GITHUB_REPOSITORY@$PREV_SHA..$GITHUB_SHA"
        $CLI releases finalize "$RELEASE"
        $CLI deploys new --release "$RELEASE" -e production

  # The app on an emulator with local files only (synthetic Enea CSVs, local-only mode) and the
  # network switched off: it must start, compute the same costs as eanalizer and open every report
  # without contacting Enea or PSE.
  ui-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build app and tests
      run: ./gradlew assembleDebug assembleDebugAndroidTest

    - name: Run instrumented tests offline
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        disable-animations: true
        script: |
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb shell svc data disable
          ./gradlew connectedDebugAndroidTest

    # Screens captured by OfflineAppTest (also on failure - shows what was on screen).
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ui-screenshots
        path: app/build/outputs/connected_android_test_additional_output/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ui-test-reports
        path: app/build/reports/androidTests/
        retention-days: 7

  # Publishes to the Play internal track. GCP identifiers live in google-play
  # environment secrets (masked in public logs). Authenticates via Workload Identity
  # Federation (keyless): GCP only trusts OIDC tokens from this repo, branch main,
  # environment google-play. The service account can only release to testing tracks.
  publish-play:
    needs: [check-and-build, ui-tests]
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         needs.check-and-build.result == 'success' &&
         needs.ui-tests.result == 'success' &&
         needs.check-and-build.outputs.is_release == 'true')
      )
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: play-publish
      cancel-in-progress: false
    env:
      PLAY_TRACK: internal
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.check-and-build.outputs.release_version }}
      # Commit the bundle was built from (scripts are always taken from the checked-out HEAD).
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
    steps:
    - name: Validate tag
      run: |
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: '$RELEASE_TAG'"; exit 1; }

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download bundle from build job
      if: github.event_name != 'workflow_dispatch'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-aab
        path: dist

    - name: Download bundle from GitHub Release
      if: github.event_name == 'workflow_dispatch'
      run: gh release download "$RELEASE_TAG" --pattern '*.aab' --dir dist
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Collect version code and release notes
      id: meta
      run: |
        AAB=$(ls dist/*.aab)
        [ "$(echo "$AAB" | wc -l)" = 1 ] || { echo "Expected exactly one .aab, got: $AAB"; exit 1; }
        VERSION_CODE=$(git show "$RELEASE_REF:app/build.gradle.kts" | sed -nE 's/^\s*versionCode\s*=\s*([0-9]+).*/\1/p')
        [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Could not read versionCode"; exit 1; }
        PREV_TAG=$(git describe --tags --abbrev=0 "$RELEASE_REF^" 2>/dev/null || true)
        git log --no-merges --pretty='• %s' ${PREV_TAG:+$PREV_TAG..}"$RELEASE_REF" \
          | grep -viE '^• (release:|formatowanie|.*ktfmt|.*spotless)' > release-notes.txt || true
        echo "Release notes:"; cat release-notes.txt
        echo "aab=$AAB" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Google Cloud (Workload Identity Federation)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.PLAY_SERVICE_ACCOUNT }}

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install publisher dependencies
      run: pip install --require-hashes -r .github/scripts/requirements.txt

    - name: Publish to Google Play
      run: |
        python .github/scripts/publish_to_play.py \
          --aab "${{ steps.meta.outputs.aab }}" \
          --version-code "${{ steps.meta.outputs.version_code }}" \
          --package com.theundefined.eanalizer \
          --track "$PLAY_TRACK" \
          --release-notes-file release-notes.txt
