name: Continuous Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.check_release.outputs.version }}
      is_release: ${{ steps.check_release.outputs.is_release }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check if this is a Release commit
      id: check_release
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ $COMMIT_MSG =~ ^release:\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          echo "is_release=true" >> $GITHUB_OUTPUT
          echo "Detected release commit for version ${BASH_REMATCH[1]}"
        else
          echo "is_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Check code formatting
      run: ./gradlew spotlessCheck

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    # Always build Debug to verify code quality
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # If it's a release commit, perform full build and signing
    - name: Decode Keystore
      if: steps.check_release.outputs.is_release == 'true'
      run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > eanalizer.jks

    - name: Build Release APK and Bundle
      if: steps.check_release.outputs.is_release == 'true'
      run: ./gradlew assembleRelease bundleRelease
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Prepare Release Assets
      if: steps.check_release.outputs.is_release == 'true'
      run: |
        VERSION="${{ steps.check_release.outputs.version }}"
        mv app/build/outputs/apk/release/app-release.apk eanalizer-mobile-${VERSION}-release.apk
        mv app/build/outputs/apk/debug/app-debug.apk eanalizer-mobile-${VERSION}-debug.apk
        mv app/build/outputs/bundle/release/app-release.aab eanalizer-mobile-${VERSION}.aab

    - name: Create Release and Upload Assets
      if: steps.check_release.outputs.is_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.check_release.outputs.version }}
        name: eAnalizer Mobile ${{ steps.check_release.outputs.version }}
        files: |
          eanalizer-mobile-*.apk
          eanalizer-mobile-*.aab
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
